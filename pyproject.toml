[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "manticora"
description = "GitOps DNS manager"
readme = "README.md"
maintainers = [ { name = "wlix13", email = "github@wlix13.dev" } ]
authors = [ { name = "wlix13", email = "github@wlix13.dev" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "natsort",
  "octodns>=1.22",
  "octodns-cloudflare",
  "pydantic",
  "pyyaml",
  "rich",
  "rich-click",
]
scripts.manticora = "manticora.__main__:main"

[dependency-groups]
dev = [ "deptry", "import-linter", "poethepoet", "prek", "ruff", "ty" ]
tests = [ "click", "pytest", "pytest-cov", "pytest-randomly", "pytest-sugar" ]

[tool.hatch]
version.path = "manticora/__init__.py"
metadata.allow-direct-references = true
build.targets.wheel.packages = [ "manticora" ]
build.targets.sdist.include = [ "manticora/**/*.py" ]

[tool.ruff]
line-length = 120
lint.select = [ "D", "E", "EXE", "F", "G010", "I", "N", "PGH", "S", "UP", "W", "YTT" ]
lint.ignore = [
  "D1",   # don't enforce missing docstrings
  "D202", # allow blank line after function docstring
  "D301", # allow \b in docstrings (Click paragraph-break marker)
  "D401", # don't enforce imperative mood
  "D419", # allow empty docstrings
]
lint.per-file-ignores."tests/*" = [
  "S101", # Use of `assert` detected
]
lint.isort.lines-after-imports = 2
lint.pydocstyle.convention = "pep257"

[tool.deptry]
per_rule_ignores.DEP002 = [
  "octodns-cloudflare", # loaded by octodns from `class:` in config.yaml, never imported here
]

[tool.ty]
environment.root = [ "./manticora" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra -q --tb=short --strict-markers"

[tool.importlinter]
root_package = "manticora"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "spine (app -> components -> models -> core)"
type = "layers"
layers = [
  "manticora.app",
  "manticora.components",
  "manticora.models",
  "manticora.core",
]

[[tool.importlinter.contracts]]
name = "components only meet through the application registry"
type = "independence"
modules = [
  "manticora.components.*",
]

[tool.poe]
tasks.format = "uv run ruff format ."
tasks.check-format = "uv run ruff format --check ."
tasks.lint = "uv run ruff check ."
tasks.typecheck = "uv run --group dev --group tests ty check"
tasks.lint-imports = "uv run --group dev lint-imports"
tasks.deptry = "uv run --group dev deptry ."
tasks.lint-md = "uv run --group dev prek run markdownlint-cli2 --all-files"
tasks.check = [ "check-format", "lint", "lint-md", "typecheck", "lint-imports", "deptry" ]
tasks.tests = "uv run --group tests pytest"
tasks.coverage = "uv run --group tests pytest --cov=manticora --cov-report=term --cov-report=html"
