version: 1
labels:
  # --- by PR "Type of change" checklist ---
  - label: "feature"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Feature\b'
  - label: "bug"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Bug fix\b'
  - label: "enhancement"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Enhancement\b'
  - label: "refactor"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Refactor\b'
  - label: "breaking-change"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Breaking change\b'
  - label: "security"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Security\b'

  # --- by changed paths ---
  - label: "docs"
    files:
      - '^README\.md$'
      - "^docs/"
  - label: "ci-cd"
    files:
      - '^\.github/'
      - '^\.pre-commit-config\.yaml$'
      - '^\.markdownlint-cli2\.jsonc$'
  - label: "tests"
    files:
      - "^tests/"
  - label: "dependencies"
    files:
      - '^uv\.lock$'
  - label: "core"
    files:
      - "^manticora/core/"
  - label: "models"
    files:
      - "^manticora/models/"
  - label: "config"
    files:
      - "^manticora/components/config/"
  - label: "dns"
    files:
      - "^manticora/components/dns/"
  - label: "records"
    files:
      - "^manticora/components/records/"
  - label: "cli"
    files:
      - '^manticora/components/[^/]+/component\.py$'
      - '^manticora/app\.py$'
      - '^manticora/__main__\.py$'
